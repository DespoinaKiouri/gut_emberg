[project]
name = "c3ppi"
version = "0.1.0"
description = "Add your description here"
dependencies = [
    "pandas>=2.3.0",
    "openpyxl>=3.1.5",
    "torch>=2.7.1",
    "transformers>=4.52.4",
    "sentencepiece>=0.2.0",
    "protobuf>=6.31.1",
    "pip>=25.1.1",
    "tqdm>=4.67.1",
    "scikit-learn>=1.7.0",
    "plotly>=6.1.2",
    "kaleido>=1.0.0",
    "pyarrow>=20.0.0",
    "statsmodels>=0.14.5",
    "xlsxwriter>=3.2.5",
]
readme = "README.md"
requires-python = ">= 3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "mkdocstrings-python>=1.16.12",
    "mkdocs-material>=9.6.14",
    "duckdb>=1.3.1",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/c3ppi"]
